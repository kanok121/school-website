<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot Password - Mojidpur Central School</title>
<link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
<meta name="theme-color" content="#2563eb">
<link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="login-body d-flex align-items-center justify-content-center">
<div class="login-card card shadow-lg p-4">
  <div class="text-center mb-3">
    <h3 class="fw-bold">🔑 Reset Password</h3>
    <p class="text-muted small">Ask your school administrator for the reset code if you don't have it.</p>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for category, message in messages %}
        <div class="alert alert-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
  {% endwith %}
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">Username</label>
      <input type="text" name="username" class="form-control" required autofocus>
    </div>
    <div class="mb-3">
      <label class="form-label">Reset Code</label>
      <input type="text" name="reset_code" class="form-control" required>
    </div>
    <div class="mb-3">
      <label class="form-label">New Password</label>
      <input type="password" name="new_password" class="form-control" minlength="6" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Confirm New Password</label>
      <input type="password" name="confirm_password" class="form-control" minlength="6" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Reset Password</button>
  </form>
  <p class="text-center mt-3">
    <a href="{{ url_for('login') }}">Back to Login</a>
  </p>
</div>
</body>
</html>
