{% extends "base.html" %}
{% block title %}School Settings{% endblock %}
{% block content %}
<h4 class="mb-3">School Settings</h4>
<div class="card p-4" style="max-width: 600px;">
<form method="POST">
  <div class="mb-3">
    <label class="form-label">School Name</label>
    <input type="text" name="name" class="form-control" value="{{ inst.name }}" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Address</label>
    <textarea name="address" class="form-control" rows="2">{{ inst.address }}</textarea>
  </div>
  <div class="mb-3">
    <label class="form-label">Phone</label>
    <input type="text" name="phone" class="form-control" value="{{ inst.phone }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Email</label>
    <input type="email" name="email" class="form-control" value="{{ inst.email }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Institute ID</label>
    <input type="text" name="institute_id" class="form-control" value="{{ inst.institute_id }}">
  </div>
  <div class="mb-3">
    <label class="form-label">Academic Year</label>
    <input type="text" name="academic_year" class="form-control" value="{{ inst.academic_year }}">
  </div>
  <button type="submit" class="btn btn-primary">Save Changes</button>
</form>
</div>
{% endblock %}
