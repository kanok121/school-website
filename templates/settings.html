{% extends "base.html" %}
{% block title %}Settings{% endblock %}
{% block content %}
<h4 class="mb-3">⚙️ School Information / Settings</h4>

<div class="card p-4" style="max-width: 600px;">
  <form method="POST">
    <div class="mb-3">
      <label class="form-label">School Name</label>
      <input type="text" name="name" class="form-control" value="{{ inst.name or '' }}" required>
    </div>
    <div class="mb-3">
      <label class="form-label">Address</label>
      <textarea name="address" class="form-control" rows="2">{{ inst.address or '' }}</textarea>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Phone</label>
        <input type="text" name="phone" class="form-control" value="{{ inst.phone or '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" value="{{ inst.email or '' }}">
      </div>
    </div>
    <div class="row">
      <div class="col-md-6 mb-3">
        <label class="form-label">Institute ID (EIIN)</label>
        <input type="text" name="institute_id" class="form-control" value="{{ inst.institute_id or '' }}">
      </div>
      <div class="col-md-6 mb-3">
        <label class="form-label">Academic Year</label>
        <input type="text" name="academic_year" class="form-control" value="{{ inst.academic_year or '' }}">
      </div>
    </div>
    <button type="submit" class="btn btn-primary">💾 Save Changes</button>
  </form>
</div>
{% endblock %}
