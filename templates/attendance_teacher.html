{% extends "base.html" %}
{% block title %}Teacher Attendance{% endblock %}
{% block content %}
<h4 class="mb-3">Teacher Attendance</h4>

<form method="GET" class="row g-2 mb-3">
  <div class="col-auto">
    <input type="date" name="date" value="{{ att_date }}" class="form-control" onchange="this.form.submit()">
  </div>
</form>

{% if teachers %}
<form method="POST">
  <input type="hidden" name="date" value="{{ att_date }}">
  <div class="table-responsive">
  <table class="table table-striped bg-white">
    <thead><tr><th>Name</th><th>Designation</th><th>Attendance</th></tr></thead>
    <tbody>
      {% for t in teachers %}
      <tr>
        <td>
          <input type="hidden" name="teacher_id" value="{{ t.id }}">
          {{ t.name }}
        </td>
        <td>{{ t.designation or '-' }}</td>
        <td>
          <select name="status_{{ t.id }}" class="form-select form-select-sm">
            <option value="Present" {% if t.current_status == 'Present' %}selected{% endif %}>Present</option>
            <option value="Absent" {% if t.current_status == 'Absent' %}selected{% endif %}>Absent</option>
            <option value="Leave" {% if t.current_status == 'Leave' %}selected{% endif %}>Leave</option>
          </select>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
  </div>
  <button type="submit" class="btn btn-primary">Save Attendance</button>
</form>
{% else %}
<p class="text-muted">No teachers found.</p>
{% endif %}
{% endblock %}
