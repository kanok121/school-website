<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mojidpur Central School</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#7c3aed">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: linear-gradient(135deg, #ec4899 0%, #a855f7 40%, #6366f1 75%, #3b82f6 100%);
      background-size: 200% 200%;
      animation: bgMove 15s ease infinite;
    }
    @keyframes bgMove {
      0% { background-position: 0% 0%; }
      50% { background-position: 100% 100%; }
      100% { background-position: 0% 0%; }
    }

    .sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1e3a8a);
      box-shadow: inset -6px -6px 14px rgba(0,0,0,0.35), 0 10px 25px rgba(0,0,0,0.25);
      z-index: 0;
      animation: floatY 6s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-16px); }
    }
    .s1 { width: 140px; height: 140px; top: 8%; left: 10%; animation-delay: 0s; }
    .s2 { width: 70px; height: 70px; top: 15%; left: 42%; animation-delay: 1s; }
    .s3 { width: 100px; height: 100px; top: 60%; right: 12%; animation-delay: 2s; }
    .s4 { width: 55px; height: 55px; bottom: 10%; left: 20%; animation-delay: 0.5s; }
    .s5 { width: 85px; height: 85px; bottom: 6%; right: 30%; animation-delay: 1.5s; }
    .ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid rgba(255,255,255,0.15);
      z-index: 0;
    }
    .r1 { width: 260px; height: 260px; top: 4%; left: -60px; }
    .r2 { width: 220px; height: 220px; bottom: -60px; right: -40px; }

    .login-card {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 2.6rem 2.2rem;
      background: rgba(255, 255, 255, 0.14);
      border: 1px solid rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      box-shadow: 0 20px 50px rgba(0,0,0,0.3);
      animation: cardEnter 0.6s cubic-bezier(.16,1,.3,1);
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-card h3 {
      color: #fff;
      font-weight: 800;
      font-size: 1.7rem;
      text-align: center;
      margin-bottom: 4px;
    }
    .login-card p.subtitle {
      text-align: center;
      color: rgba(255,255,255,0.8);
      font-size: 0.88rem;
      margin-bottom: 1.8rem;
    }

    .form-label {
      color: rgba(255,255,255,0.9);
      font-weight: 500;
      font-size: 0.82rem;
      margin-bottom: 6px;
    }
    .input-wrap { position: relative; margin-bottom: 1.1rem; }
    .form-control {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 12px;
      color: #fff;
      padding: 0.7rem 1rem;
      font-size: 0.95rem;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.6); }
    .form-control:focus {
      background: rgba(255,255,255,0.22);
      border-color: rgba(255,255,255,0.6);
      color: #fff;
      box-shadow: 0 0 0 4px rgba(255,255,255,0.1);
    }
    .toggle-pass {
      position: absolute;
      right: 14px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      color: rgba(255,255,255,0.75);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0;
    }
    .toggle-pass:hover { color: #fff; }

    .btn-login {
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      border: none;
      border-radius: 12px;
      padding: 0.8rem;
      font-weight: 700;
      font-size: 0.98rem;
      color: #1f2937;
      letter-spacing: 0.3px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 24px rgba(245, 158, 11, 0.4);
      color: #1f2937;
    }
    .btn-login:active { transform: translateY(0); }

    .alert {
      border-radius: 10px;
      font-size: 0.85rem;
      padding: 0.55rem 0.85rem;
      margin-bottom: 1rem;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }

    @media (max-width: 480px) {
      .sphere, .ring { display: none; }
      .login-card { padding: 2rem 1.5rem; }
    }
  </style>
</head>
<body class="login-body">
  <div class="ring r1"></div>
  <div class="ring r2"></div>
  <div class="sphere s1"></div>
  <div class="sphere s2"></div>
  <div class="sphere s3"></div>
  <div class="sphere s4"></div>
  <div class="sphere s5"></div>

  <div class="login-card">
    <h3>🏫 Mojidpur Central School</h3>
    <p class="subtitle">Login to the School Management System</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST">
      <label class="form-label">Username</label>
      <div class="input-wrap">
        <input type="text" name="username" class="form-control" placeholder="Enter your username" required autofocus>
      </div>

      <label class="form-label">Password</label>
      <div class="input-wrap">
        <input type="password" name="password" id="passwordField" class="form-control" placeholder="Enter your password" required>
        <button type="button" class="toggle-pass" onclick="togglePassword()">👁</button>
      </div>

      <button type="submit" class="btn btn-login w-100 mt-2">Login</button>
    </form>
  </div>

  <script>
    function togglePassword() {
      const field = document.getElementById('passwordField');
      field.type = field.type === 'password' ? 'text' : 'password';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    }
  </script>
</body>
</html>
