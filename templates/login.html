<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mojidpur Central School</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#2563eb">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { font-family: 'Inter', sans-serif; }

    body.login-body {
      min-height: 100vh;
      margin: 0;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 45%, #3b82f6 100%);
      background-size: 200% 200%;
      animation: gradientMove 12s ease infinite;
      position: relative;
      overflow: hidden;
    }

    @keyframes gradientMove {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    body.login-body::before,
    body.login-body::after {
      content: "";
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      z-index: 0;
    }

    body.login-body::before {
      width: 350px;
      height: 350px;
      top: -100px;
      left: -100px;
    }

    body.login-body::after {
      width: 250px;
      height: 250px;
      bottom: -80px;
      right: -80px;
    }

    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 400px;
      border: none;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(10px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
      padding: 2.5rem 2rem !important;
      animation: cardEnter 0.6s ease;
    }

    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 12px;
      background: linear-gradient(135deg, #2563eb, #1e3a8a);
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .login-card h3 {
      color: #111827;
      font-weight: 700;
      font-size: 1.4rem;
      margin-bottom: 2px;
    }

    .login-card p.text-muted {
      font-size: 0.9rem;
      color: #6b7280 !important;
    }

    .form-label {
      font-weight: 500;
      font-size: 0.85rem;
      color: #374151;
    }

    .form-control {
      border-radius: 10px;
      border: 1.5px solid #e5e7eb;
      padding: 0.65rem 0.9rem;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-control:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
    }

    .btn-primary {
      background: linear-gradient(135deg, #2563eb, #1e40af);
      border: none;
      border-radius: 10px;
      padding: 0.7rem;
      font-weight: 600;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
    }

    .btn-primary:active {
      transform: translateY(0);
    }

    .alert {
      border-radius: 10px;
      font-size: 0.9rem;
      padding: 0.6rem 0.9rem;
    }
  </style>
</head>
<body class="login-body d-flex align-items-center justify-content-center">
  <div class="login-card card p-4">
    <div class="text-center mb-3">
      <div class="login-logo">🏫</div>
      <h3>Mojidpur Central School</h3>
      <p class="text-muted mb-0">Login to the School Management System</p>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" required autofocus>
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-primary w-100">Login</button>
    </form>
  </div>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    }
  </script>
</body>
</html>
