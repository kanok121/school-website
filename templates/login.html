<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mojidpur Central School</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#374151">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow: hidden;
      background: radial-gradient(circle at 50% 40%, #4b5563, #1f2937 75%);
    }

    .sphere {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, #fde047, #f97316 60%, #ea580c);
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
      z-index: 0;
      animation: floatY 7s ease-in-out infinite;
    }
    @keyframes floatY {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-18px); }
    }
    .s1 { width: 220px; height: 220px; top: 6%; left: 8%; animation-delay: 0s; }
    .s2 { width: 110px; height: 110px; top: 55%; right: 6%; animation-delay: 1.2s; }
    .s3 { width: 170px; height: 170px; bottom: 4%; left: 14%; animation-delay: 0.6s; }
    .s4 { width: 90px; height: 90px; bottom: 18%; right: 22%; animation-delay: 1.8s; }

    .login-card {
      position: relative;
      z-index: 2;
      width: 460px;
      max-width: 92vw;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.12);
      border: 3px solid rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow:
        0 25px 60px rgba(0,0,0,0.45),
        inset 0 1px 1px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: cardEnter 0.7s cubic-bezier(.16,1,.3,1);
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    .login-inner {
      width: 78%;
      color: #fff;
    }

    .login-inner h3 {
      font-weight: 800;
      font-size: 1.5rem;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    .login-inner p.subtitle {
      font-size: 0.8rem;
      color: rgba(255,255,255,0.75);
      margin-bottom: 1.4rem;
    }
    .login-inner hr.divider {
      border: none;
      border-top: 1.5px solid rgba(255,255,255,0.4);
      margin: 0 0 1.4rem;
    }

    .form-label {
      font-weight: 700;
      font-size: 0.82rem;
      color: #fff;
      margin-bottom: 4px;
      display: block;
    }
    .input-wrap { margin-bottom: 1rem; }
    .form-control {
      background: transparent;
      border: none;
      border-bottom: 1.5px solid rgba(255,255,255,0.5);
      border-radius: 0;
      color: #fff;
      padding: 0.4rem 0.1rem;
      font-size: 0.95rem;
    }
    .form-control::placeholder { color: rgba(255,255,255,0.5); }
    .form-control:focus {
      background: transparent;
      border-bottom-color: #fbbf24;
      box-shadow: none;
      color: #fff;
    }

    .btn-login {
      background: #1f2937;
      border: none;
      border-radius: 8px;
      padding: 0.65rem;
      font-weight: 700;
      font-size: 0.92rem;
      letter-spacing: 1px;
      color: #fff;
      margin-top: 0.6rem;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .btn-login:hover {
      background: #111827;
      transform: translateY(-2px);
      color: #fff;
    }

    .forgot-link {
      display: block;
      text-align: center;
      font-size: 0.75rem;
      color: rgba(255,255,255,0.75);
      margin-top: 0.9rem;
    }
    .forgot-link a {
      color: #fb923c;
      font-weight: 700;
      text-decoration: none;
    }
    .forgot-link a:hover { text-decoration: underline; }

    .alert {
      border-radius: 8px;
      font-size: 0.8rem;
      padding: 0.4rem 0.7rem;
      margin-bottom: 0.9rem;
      background: rgba(255,255,255,0.2);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.3);
    }

    @media (max-width: 480px) {
      .sphere { transform: scale(0.6); }
      .login-card { width: 340px; }
      .login-inner h3 { font-size: 1.2rem; }
    }
  </style>
</head>
<body class="login-body">
  <div class="sphere s1"></div>
  <div class="sphere s2"></div>
  <div class="sphere s3"></div>
  <div class="sphere s4"></div>

  <div class="login-card">
    <div class="login-inner">
      <h3>LOGIN</h3>
      <p class="subtitle">Mojidpur Central School</p>
      <hr class="divider">

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>

        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" name="password" class="form-control" placeholder="Enter password" required>
        </div>

        <button type="submit" class="btn btn-login w-100">SIGN IN</button>
      </form>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    }
  </script>
</body>
</html>
