<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mojidpur Central School</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body.login-body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: #000;
      position: relative;
      overflow: hidden;
    }

    .wave {
      position: absolute;
      width: 700px; height: 700px;
      border-radius: 50%;
      filter: blur(40px);
      opacity: 0.55;
      z-index: 0;
    }
    .wave-red {
      background: conic-gradient(from 90deg, transparent 0%, #ef4444 12%, #f97316 20%, transparent 35%);
      top: -180px; left: -260px;
      transform: rotate(-20deg);
      animation: driftA 10s ease-in-out infinite;
    }
    .wave-purple {
      background: conic-gradient(from 270deg, transparent 0%, #a855f7 12%, #ec4899 20%, transparent 35%);
      bottom: -220px; right: -260px;
      transform: rotate(15deg);
      animation: driftB 12s ease-in-out infinite;
    }
    @keyframes driftA {
      0%, 100% { transform: rotate(-20deg) translateY(0); }
      50% { transform: rotate(-15deg) translateY(-15px); }
    }
    @keyframes driftB {
      0%, 100% { transform: rotate(15deg) translateY(0); }
      50% { transform: rotate(20deg) translateY(15px); }
    }

    .login-card {
      position: relative;
      z-index: 2;
      width: 480px;
      max-width: 92vw;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 30%, rgba(60,80,85,0.55), rgba(10,15,18,0.85));
      border: 1px solid rgba(255,255,255,0.12);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      box-shadow: 0 30px 70px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: cardEnter 0.7s cubic-bezier(.16,1,.3,1);
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .login-inner { width: 74%; color: #fff; }

    .login-inner h3 {
      font-weight: 700;
      font-size: 1.5rem;
      letter-spacing: 1px;
      margin-bottom: 1.6rem;
      color: #f1f5f9;
    }

    .input-wrap { position: relative; margin-bottom: 1rem; }
    .form-control {
      background: linear-gradient(135deg, rgba(20,60,60,0.55), rgba(10,30,35,0.7));
      border: 1px solid rgba(45,212,191,0.35);
      border-radius: 10px;
      color: #e2f4f2;
      padding: 0.7rem 2.6rem 0.7rem 1rem;
      font-size: 0.9rem;
    }
    .form-control::placeholder { color: rgba(226,244,242,0.45); }
    .form-control:focus {
      background: linear-gradient(135deg, rgba(20,70,70,0.7), rgba(10,35,40,0.85));
      border-color: #2dd4bf;
      box-shadow: 0 0 0 3px rgba(45,212,191,0.15);
      color: #fff;
    }
    .input-icon {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      color: rgba(226,244,242,0.7); font-size: 0.95rem;
      background: none; border: none; cursor: pointer; padding: 0;
    }

    .btn-login {
      width: 100%;
      background: linear-gradient(135deg, #1f2937, #111827);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 0.65rem;
      color: #f1f5f9;
      font-weight: 700;
      font-size: 0.88rem;
      letter-spacing: 0.5px;
      margin-top: 0.4rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .btn-login:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.5);
      color: #fff;
    }

    .row-links {
      display: flex; justify-content: space-between; align-items: center;
      margin-top: 0.9rem;
      font-size: 0.75rem;
      color: rgba(226,244,242,0.75);
    }
    .row-links label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .row-links input[type="checkbox"] { accent-color: #2dd4bf; }
    .row-links a { color: rgba(226,244,242,0.85); text-decoration: none; }
    .row-links a:hover { text-decoration: underline; }

    .alert {
      border-radius: 8px; font-size: 0.75rem; padding: 0.4rem 0.7rem;
      margin-bottom: 0.8rem; background: rgba(45,212,191,0.12);
      color: #e2f4f2; border: 1px solid rgba(45,212,191,0.3);
    }

    @media (max-width: 480px) {
      .wave { width: 420px; height: 420px; }
      .login-card { width: 340px; }
      .login-inner h3 { font-size: 1.2rem; }
    }
  </style>
</head>
<body class="login-body">
  <div class="wave wave-red"></div>
  <div class="wave wave-purple"></div>

  <div class="login-card">
    <div class="login-inner">
      <h3>LOGIN</h3>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <div class="input-wrap">
          <input type="text" name="username" class="form-control" placeholder="Username" required autofocus>
          <span class="input-icon">👤</span>
        </div>

        <div class="input-wrap">
          <input type="password" name="password" id="passwordField" class="form-control" placeholder="Password" required>
          <button type="button" class="input-icon" onclick="togglePassword()">🔒</button>
        </div>

        <button type="submit" class="btn-login">LOGIN</button>

        <div class="row-links">
          <label><input type="checkbox"> Remember me</label>
          <a href="{{ url_for('forgot_password') }}">Forgot password?</a>
        </div>
      </form>
    </div>
  </div>

  <script>
    function togglePassword() {
      const field = document.getElementById('passwordField');
      field.type = field.type === 'password' ? 'text' : 'password';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    }
  </script>
</body>
</html>
