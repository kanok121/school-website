<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Mojidpur Central School</title>
  <link rel="manifest" href="{{ url_for('static', filename='manifest.json') }}">
  <meta name="theme-color" content="#2c5f7c">
  <link rel="icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='icons/icon-192.png') }}">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    * { font-family: 'Inter', sans-serif; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }

    body.login-body {
      min-height: 100vh;
      margin: 0;
      position: relative;
      overflow-x: hidden;
      background: linear-gradient(180deg, #dbeafe 0%, #bfdbfe 40%, #93c5fd 100%);
    }

    .scene { position: absolute; inset: 0; z-index: 0; overflow: hidden; }
    .sun { position: absolute; top: -60px; left: 50%; transform: translateX(-50%);
      width: 220px; height: 220px; border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #fef9e7 60%, rgba(255,255,255,0) 75%); }
    .cloud { position: absolute; background: rgba(255,255,255,0.85); border-radius: 50px; }
    .c1 { width: 140px; height: 55px; top: 30px; left: 3%; }
    .c2 { width: 100px; height: 40px; top: 70px; right: 6%; }
    .mtn-back { position: absolute; bottom: 0; width: 100%; height: 55%;
      background: #7fb3d5; clip-path: polygon(0 60%, 15% 30%, 30% 55%, 48% 15%, 65% 50%, 82% 20%, 100% 45%, 100% 100%, 0 100%); }
    .mtn-front { position: absolute; bottom: 0; width: 100%; height: 42%;
      background: #4a90b8; clip-path: polygon(0 70%, 20% 35%, 38% 65%, 55% 25%, 72% 60%, 90% 30%, 100% 55%, 100% 100%, 0 100%); }
    .trees { position: absolute; bottom: 0; width: 100%; height: 38%; background: #0d2b3e;
      clip-path: polygon(
        0% 100%, 0% 55%, 3% 40%, 5% 55%, 7% 35%, 9% 55%, 11% 60%, 11% 100%,
        14% 100%, 14% 50%, 16% 30%, 18% 50%, 20% 25%, 22% 50%, 23% 58%, 23% 100%,
        90% 100%, 90% 58%, 92% 30%, 94% 55%, 96% 25%, 98% 55%, 100% 40%, 100% 100%
      ); }
    .bird { position: absolute; font-size: 18px; color: #1f2937; }
    .b1 { top: 130px; left: 12%; } .b2 { top: 150px; right: 14%; }

    .navbar-custom {
      position: relative; z-index: 2;
      display: flex; justify-content: flex-end; align-items: center;
      gap: 28px; padding: 22px 40px;
      font-size: 0.85rem; font-weight: 600; color: #1f2937;
      letter-spacing: 0.5px;
    }
    .navbar-custom a { color: #1f2937; text-decoration: none; }
    .navbar-custom a.active { color: #fff; }

    .center-wrap {
      position: relative; z-index: 2;
      display: flex; align-items: center; justify-content: center;
      min-height: 78vh; padding: 20px;
    }

    .login-card {
      width: 100%; max-width: 420px;
      border-radius: 16px;
      padding: 2.2rem 2.2rem 2rem;
      background: linear-gradient(180deg, rgba(255,255,255,0.35), rgba(60,110,140,0.35));
      border: 1px solid rgba(255,255,255,0.4);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 25px 50px rgba(0,0,0,0.25);
      animation: cardEnter 0.6s cubic-bezier(.16,1,.3,1);
    }
    @keyframes cardEnter {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card h3 {
      text-align: center; font-weight: 800; font-size: 1.4rem;
      letter-spacing: 1px; color: #1f2937; margin-bottom: 1.6rem;
    }

    .form-label {
      font-size: 0.8rem; font-weight: 600; color: #1f2937; margin-bottom: 2px; display: block;
    }
    .input-wrap { position: relative; margin-bottom: 1.1rem; }
    .form-control {
      background: transparent; border: none;
      border-bottom: 1.5px solid rgba(31,41,55,0.5);
      border-radius: 0; padding: 0.35rem 1.6rem 0.35rem 0.1rem;
      font-size: 0.92rem; color: #1f2937;
    }
    .form-control::placeholder { color: rgba(31,41,55,0.45); }
    .form-control:focus {
      background: transparent; box-shadow: none;
      border-bottom-color: #1f2937; color: #1f2937;
    }
    .input-icon {
      position: absolute; right: 0; bottom: 8px;
      font-size: 0.95rem; color: rgba(31,41,55,0.6);
      background: none; border: none; cursor: pointer;
    }

    .forgot-link {
      display: block; text-align: right; font-size: 0.72rem;
      color: #1f2937; margin-top: -6px; margin-bottom: 1rem;
    }
    .forgot-link b { font-weight: 700; }

    .remember-row {
      display: flex; align-items: center; gap: 8px;
      font-size: 0.82rem; color: #1f2937; margin-bottom: 1.4rem;
    }
    .remember-row input { accent-color: #1f2937; }

    .btn-login {
      background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(120,160,190,0.55));
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 8px; padding: 0.65rem;
      font-weight: 700; font-size: 0.9rem; color: #1f2937;
      letter-spacing: 0.5px;
      transition: transform 0.15s ease;
    }
    .btn-login:hover { transform: translateY(-2px); color: #1f2937; }

    .register-row {
      text-align: center; font-size: 0.78rem; color: #1f2937; margin-top: 1rem;
    }
    .register-row b { font-weight: 700; }

    .alert {
      border-radius: 8px; font-size: 0.8rem; padding: 0.5rem 0.8rem;
      margin-bottom: 1rem; background: rgba(255,255,255,0.4); color: #1f2937;
      border: 1px solid rgba(255,255,255,0.5);
    }

    @media (max-width: 500px) {
      .navbar-custom { gap: 14px; padding: 16px 18px; font-size: 0.72rem; }
      .login-card { padding: 1.8rem 1.5rem; }
    }
  </style>
</head>
<body class="login-body">
  <div class="scene">
    <div class="sun"></div>
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="bird b1">〜</div>
    <div class="bird b2">〜</div>
    <div class="mtn-back"></div>
    <div class="mtn-front"></div>
    <div class="trees"></div>
  </div>

  <div class="navbar-custom">
    <a href="#">HOME</a>
    <a href="#">ABOUT</a>
    <a href="#">SERVICE</a>
    <a href="#">CONTACT</a>
    <a href="#" class="active">LOGIN</a>
  </div>

  <div class="center-wrap">
    <div class="login-card">
      <h3>LOGIN</h3>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form method="POST">
        <label class="form-label">Username</label>
        <div class="input-wrap">
          <input type="text" name="username" class="form-control" placeholder="Enter username" required autofocus>
          <span class="input-icon">👤</span>
        </div>

        <label class="form-label">Password</label>
        <div class="input-wrap">
          <input type="password" name="password" id="passwordField" class="form-control" placeholder="Enter password" required>
          <button type="button" class="input-icon" onclick="togglePassword()">👁</button>
        </div>
        <a href="#" class="forgot-link">Forgot <b>Password?</b></a>

        <label class="remember-row">
          <input type="checkbox"> Remember Me
        </label>

        <button type="submit" class="btn btn-login w-100">Login</button>
      </form>

      <div class="register-row">Don't have an Account? <b>Register</b></div>
    </div>
  </div>

  <script>
    function togglePassword() {
      const field = document.getElementById('passwordField');
      field.type = field.type === 'password' ? 'text' : 'password';
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register("{{ url_for('static', filename='sw.js') }}");
    }
  </script>
</body>
</html>
